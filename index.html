<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Albert's Run">
<meta name="description" content="Albert's 48-week half marathon training tracker">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg: #0a0a0a;
    --bg-elev: #141414;
    --bg-card: #1a1a1a;
    --border: #262626;
    --border-active: #404040;
    --text: #fafafa;
    --text-dim: #a3a3a3;
    --text-faint: #525252;
    --lime: #a3e635;
    --lime-dim: #65a30d;
    --amber: #fbbf24;
    --orange: #fb923c;
    --red: #f87171;
    --blue: #60a5fa;
    --phase-1: #a3e635;
    --phase-2: #fbbf24;
    --phase-3: #fb923c;
    --phase-4: #f87171;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body {
    background:
      radial-gradient(ellipse at top, rgba(163,230,53,0.05), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(248,113,113,0.04), transparent 60%),
      var(--bg);
    padding: 16px 14px 80px;
  }
  .app { max-width: 540px; margin: 0 auto; }

  /* HEADER */
  .head {
    border-bottom: 1px solid var(--border);
    padding-bottom: 18px;
    margin-bottom: 18px;
  }
  .head__sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--lime);
    text-transform: uppercase;
    margin-bottom: 6px;
    display:flex; align-items:center; gap:8px;
  }
  .head__sub::before {
    content:""; width:6px; height:6px; background: var(--lime); border-radius:50%;
    box-shadow: 0 0 12px var(--lime);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .head__row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .head__text { flex: 1; min-width: 0; }
  .head__icon {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    box-shadow:
      0 10px 24px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.06),
      0 0 30px rgba(72,187,120,0.15);
    flex-shrink: 0;
    animation: iconIn 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    transition: transform 0.2s;
  }
  .head__icon:active { transform: scale(0.94); }
  @keyframes iconIn {
    from { opacity: 0; transform: scale(0.7) rotate(-12deg); }
    to { opacity: 1; transform: scale(1) rotate(0); }
  }
  .head__title {
    font-family: 'Anton', sans-serif;
    font-size: 34px;
    line-height: 0.9;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  .head__title span { color: var(--lime); }
  .head__goal {
    margin-top: 8px;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 500;
  }

  /* STATS BAR */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .stat {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 12px 10px;
    border-radius: 8px;
  }
  .stat__label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat__val {
    font-family: 'Anton', sans-serif;
    font-size: 22px;
    letter-spacing: -0.02em;
  }
  .stat__val span { color: var(--text-faint); font-size: 14px; }

  /* PROGRESS BAR */
  .prog {
    height: 4px;
    background: var(--bg-card);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 22px;
    border: 1px solid var(--border);
  }
  .prog__fill {
    height: 100%;
    background: linear-gradient(90deg, var(--phase-1), var(--phase-2), var(--phase-3), var(--phase-4));
    width: 0%;
    transition: width 0.4s ease;
  }

  /* PHASE TABS */
  .phases {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 22px;
  }
  .phase {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 6px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    position: relative;
  }
  .phase:active { transform: scale(0.97); }
  .phase__num {
    font-family: 'Anton', sans-serif;
    font-size: 16px;
    letter-spacing: 0;
    color: var(--text-dim);
  }
  .phase__name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-top: 2px;
  }
  .phase.active { background: var(--bg-elev); border-color: var(--border-active); }
  .phase.active .phase__num,
  .phase.active .phase__name { color: var(--text); }
  .phase[data-phase="1"].active { border-color: var(--phase-1); }
  .phase[data-phase="1"].active .phase__num { color: var(--phase-1); }
  .phase[data-phase="2"].active { border-color: var(--phase-2); }
  .phase[data-phase="2"].active .phase__num { color: var(--phase-2); }
  .phase[data-phase="3"].active { border-color: var(--phase-3); }
  .phase[data-phase="3"].active .phase__num { color: var(--phase-3); }
  .phase[data-phase="4"].active { border-color: var(--phase-4); }
  .phase[data-phase="4"].active .phase__num { color: var(--phase-4); }

  /* PHASE HEADER */
  .phase-head {
    margin-bottom: 14px;
    padding: 14px;
    background: var(--bg-card);
    border-radius: 10px;
    border: 1px solid var(--border);
    border-left-width: 3px;
  }
  .phase-head__title {
    font-family: 'Anton', sans-serif;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }
  .phase-head__desc {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
    line-height: 1.5;
  }

  /* WEEKS */
  .week {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .week.current {
    border-color: var(--lime);
    box-shadow: 0 0 0 1px var(--lime), 0 0 24px rgba(163,230,53,0.15);
  }
  .week.complete { opacity: 0.6; }
  .week__head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
  }
  .week__head:active { background: var(--bg-elev); }
  .week__left { display: flex; align-items: baseline; gap: 10px; }
  .week__num {
    font-family: 'Anton', sans-serif;
    font-size: 22px;
    line-height: 1;
    color: var(--text);
  }
  .week.complete .week__num { color: var(--text-faint); text-decoration: line-through; }
  .week__lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--text-faint);
    text-transform: uppercase;
  }
  .week__badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 4px;
    border: 1px solid;
  }
  .week__badge.deload { color: var(--blue); border-color: rgba(96,165,250,0.4); }
  .week__badge.test { color: var(--amber); border-color: rgba(251,191,36,0.4); }
  .week__badge.race { color: var(--lime); border-color: var(--lime); background: rgba(163,230,53,0.1); }
  .week__right {
    display: flex; align-items: center; gap: 10px;
  }
  .week__km {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }
  .week__km strong { color: var(--lime); font-weight: 700; }
  .week__arrow {
    color: var(--text-faint);
    font-size: 12px;
    transition: transform 0.2s;
  }
  .week.open .week__arrow { transform: rotate(90deg); color: var(--lime); }

  .week__title {
    padding: 0 14px 8px;
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
  }
  .week.complete .week__title { color: var(--text-faint); }

  /* WORKOUTS */
  .workouts {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .week.open .workouts { max-height: 900px; }
  .workouts-inner {
    padding: 4px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .wo {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
  }
  .wo:active { transform: scale(0.985); }
  .wo.done { background: rgba(163,230,53,0.06); border-color: rgba(163,230,53,0.3); }

  .wo__check {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: 1.5px solid var(--border-active);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .wo.done .wo__check {
    background: var(--lime);
    border-color: var(--lime);
  }
  .wo.done .wo__check::after {
    content: "✓";
    color: var(--bg);
    font-weight: 800;
    font-size: 16px;
  }

  .wo__main { flex: 1; min-width: 0; }
  .wo__top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .wo__day {
    font-family: 'Anton', sans-serif;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--text);
    text-transform: uppercase;
  }
  .wo.done .wo__day { color: var(--text-faint); }
  .wo__type {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.15em;
    padding: 2px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .wo__type.easy { color: var(--text-dim); background: rgba(255,255,255,0.05); }
  .wo__type.long { color: var(--amber); background: rgba(251,191,36,0.1); }
  .wo__type.tempo { color: var(--orange); background: rgba(251,146,60,0.1); }
  .wo__type.intervals { color: var(--red); background: rgba(248,113,113,0.1); }
  .wo__type.race-pace { color: var(--red); background: rgba(248,113,113,0.1); }
  .wo__type.race { color: var(--lime); background: rgba(163,230,53,0.15); font-weight: 700; }

  .wo__dist {
    font-family: 'Anton', sans-serif;
    font-size: 24px;
    letter-spacing: -0.02em;
    color: var(--lime);
    margin-left: auto;
    flex-shrink: 0;
  }
  .wo.done .wo__dist { color: var(--text-faint); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .wo__dist span { font-size: 10px; color: var(--text-faint); margin-left: 1px; }

  .wo__meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    line-height: 1.5;
  }
  .wo__note {
    color: var(--lime); font-weight: 500;
  }
  .wo__date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--lime-dim);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  /* CORE NOTE */
  .core-reminder {
    margin-top: 8px;
    padding: 10px 12px;
    background: rgba(96,165,250,0.06);
    border: 1px dashed rgba(96,165,250,0.2);
    border-radius: 6px;
    font-size: 10px;
    color: var(--blue);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.03em;
  }

  /* FOOTER */
  .foot {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--text-faint);
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.1em;
  }
  .foot__line {
    color: var(--lime);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .reset-btn {
    margin-top: 8px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-faint);
    padding: 6px 12px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .reset-btn:hover { color: var(--red); border-color: var(--red); }
</style>
</head>

// Workout type labels
const WO_LABELS = {
  'easy': 'Easy',
  'long': 'Long',
  'tempo': 'Tempo',
  'intervals': 'Interwały',
  'race-pace': 'Race pace',
  'race': '🏆 RACE'
};

// HR / pace guidance per workout type
const WO_META = {
  'easy':       'HR <160 · 7:30-8:00/km · rozmowa pełnymi zdaniami',
  'long':       'HR <160 · 7:00-8:00/km · 9 min bieg / 1 min marsz powyżej 10km',
  'tempo':      'HR 132-151 · ~6:00-6:30/km · krótkie zdania',
  'intervals':  'HR 151-170 · ~5:00-5:30/km · 2 min trucht między',
  'race-pace':  'Tempo startowe ~6:00-7:00/km · HR ~140-150',
  'race':       'START! · pierwsze 5 km easy · potem cisniemy 💪'
};

// =========================
// STATE
// =========================
let state = {
  completed: {},          // { "weekNum-workoutIdx": "2024-05-29" }
  openWeeks: {},          // { 1: true, 2: false ... }
  currentPhase: 1
};

// =========================
// STORAGE
// =========================
const KEY = 'albert_run_v1';

// Storage abstraction. Tries Claude's window.storage first (when running
// as an artifact in claude.ai), falls back to localStorage (standalone
// browser, downloaded HTML, mobile Safari/Chrome, etc.). Either path
// persists data across page reloads and browser restarts.
const storage = {
  async get(key) {
    if (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') {
      try {
        const res = await window.storage.get(key);
        if (res && res.value !== undefined && res.value !== null) return res.value;
      } catch (e) { /* fall through to localStorage */ }
    }
    try { return localStorage.getItem(key); }
    catch (e) { return null; }
  },
  async set(key, value) {
    let saved = false;
    if (typeof window !== 'undefined' && window.storage && typeof window.storage.set === 'function') {
      try {
        await window.storage.set(key, value);
        saved = true;
      } catch (e) { /* fall through to localStorage */ }
    }
    try { localStorage.setItem(key, value); saved = true; }
    catch (e) { /* ignore */ }
    return saved;
  }
};

async function loadState() {
  try {
    const raw = await storage.get(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = { ...state, ...parsed };
    }
  } catch (e) {
    console.log('First run, no saved state');
  }
}

async function saveState() {
  try {
    await storage.set(KEY, JSON.stringify(state));
  } catch (e) {
    console.error('Save failed:', e);
  }
}

// =========================
// HELPERS
// =========================
function fmtKm(n) {
  return n % 1 === 0 ? String(n) : n.toFixed(1).replace('.', ',');
}

function fmtDate(d) {
  const dt = new Date(d);
  const dd = String(dt.getDate()).padStart(2, '0');
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  return `${dd}.${mm}`;
}

function weekKm(week) {
  return week.wo.reduce((s, w) => s + w[1], 0);
}

function isWeekComplete(week) {
  return week.wo.every((_, i) => state.completed[`${week.n}-${i}`]);
}

function getCurrentWeek() {
  // Find first non-completed week
  for (const w of WEEKS) {
    if (!isWeekComplete(w)) return w.n;
  }
  return 48;
}

function totalKm() {
  let km = 0;
  for (const w of WEEKS) {
    w.wo.forEach((wo, i) => {
      if (state.completed[`${w.n}-${i}`]) km += wo[1];
    });
  }
  return km;
}

function totalDone() {
  return Object.keys(state.completed).length;
}

function totalPlannedKm() {
  return WEEKS.reduce((s, w) => s + weekKm(w), 0);
}

// =========================
// RENDER
// =========================
function renderStats() {
  const done = totalDone();
  const km = totalKm();
  const currentWeek = getCurrentWeek();
  const totalKmPlanned = totalPlannedKm();

  document.getElementById('stat-done').innerHTML = `${done}<span>/144</span>`;
  document.getElementById('stat-km').innerHTML = `${fmtKm(Math.round(km*10)/10)}<span>/${Math.round(totalKmPlanned)}</span>`;
  document.getElementById('stat-week').innerHTML = `${currentWeek}<span>/48</span>`;

  const pct = (done / 144) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
}

function renderPhaseTabs() {
  document.querySelectorAll('.phase').forEach(el => {
    const p = +el.dataset.phase;
    el.classList.toggle('active', p === state.currentPhase);
  });
}

function renderPhaseContent() {
  const phase = PHASES.find(p => p.id === state.currentPhase);
  const phaseWeeks = WEEKS.filter(w => w.p === state.currentPhase);
  const currentWeekNum = getCurrentWeek();

  const html = `
    <div class="phase-head" style="border-left-color: ${phase.color};">
      <div class="phase-head__title">Faza ${phase.id} · ${phase.name}</div>
      <div class="phase-head__desc">Miesiące ${phase.months} · cel: ${phase.goal}</div>
    </div>
    ${phaseWeeks.map(w => renderWeek(w, currentWeekNum)).join('')}
  `;
  document.getElementById('phase-content').innerHTML = html;

  // Attach handlers
  phaseWeeks.forEach(w => {
    document.getElementById(`week-head-${w.n}`)?.addEventListener('click', () => toggleWeekOpen(w.n));
    w.wo.forEach((_, i) => {
      document.getElementById(`wo-${w.n}-${i}`)?.addEventListener('click', () => toggleWorkout(w.n, i));
    });
  });
}

function renderWeek(week, currentWeekNum) {
  const isCurrent = week.n === currentWeekNum;
  const isComplete = isWeekComplete(week);
  const isOpen = state.openWeeks[week.n] ?? isCurrent;
  const km = weekKm(week);
  const doneCount = week.wo.filter((_, i) => state.completed[`${week.n}-${i}`]).length;

  let badge = '';
  if (week.type === 'deload') badge = '<span class="week__badge deload">Deload</span>';
  else if (week.type === 'test') badge = '<span class="week__badge test">Test</span>';
  else if (week.type === 'race') badge = '<span class="week__badge race">START</span>';

  return `
    <div class="week ${isCurrent ? 'current' : ''} ${isComplete ? 'complete' : ''} ${isOpen ? 'open' : ''}" id="week-${week.n}">
      <div class="week__head" id="week-head-${week.n}">
        <div class="week__left">
          <div class="week__num">T${week.n}</div>
          <div class="week__lbl">${isCurrent ? '· bieżący' : ''}</div>
          ${badge}
        </div>
        <div class="week__right">
          <div class="week__km"><strong>${doneCount}/${week.wo.length}</strong> · ${fmtKm(km)} km</div>
          <div class="week__arrow">▸</div>
        </div>
      </div>
      <div class="week__title">${week.t}</div>
      <div class="workouts">
        <div class="workouts-inner">
          ${week.wo.map((wo, i) => renderWorkout(week.n, i, wo)).join('')}
          <div class="core-reminder">+ Core 3× tydzień: plank · mostek · bird dog · dead bug</div>
        </div>
      </div>
    </div>
  `;
}

function renderWorkout(weekNum, idx, wo) {
  const [day, km, type, note] = wo;
  const key = `${weekNum}-${idx}`;
  const done = state.completed[key];
  const dateStr = done ? `Ukończony · ${fmtDate(done)}` : '';

  return `
    <div class="wo ${done ? 'done' : ''}" id="wo-${weekNum}-${idx}">
      <div class="wo__check"></div>
      <div class="wo__main">
        <div class="wo__top">
          <div class="wo__day">${day}</div>
          <div class="wo__type ${type}">${WO_LABELS[type]}</div>
          <div class="wo__dist">${fmtKm(km)}<span>km</span></div>
        </div>
        <div class="wo__meta">${note ? `<span class="wo__note">${note}</span>` : WO_META[type]}</div>
        ${done ? `<div class="wo__date">${dateStr}</div>` : ''}
      </div>
    </div>
  `;
}

function render() {
  renderStats();
  renderPhaseTabs();
  renderPhaseContent();
}

// =========================
// EVENTS
// =========================
async function toggleWorkout(weekNum, idx) {
  const key = `${weekNum}-${idx}`;
  if (state.completed[key]) {
    delete state.completed[key];
  } else {
    state.completed[key] = new Date().toISOString();
  }
  await saveState();
  render();
}

function toggleWeekOpen(weekNum) {
  state.openWeeks[weekNum] = !(state.openWeeks[weekNum] ?? (weekNum === getCurrentWeek()));
  saveState();
  render();
}

async function changePhase(phaseId) {
  state.currentPhase = phaseId;
  await saveState();
  render();
}

async function resetAll() {
  if (!confirm('Na pewno wyzerować cały progres? Tej operacji nie można cofnąć.')) return;
  state.completed = {};
  state.openWeeks = {};
  await saveState();
  render();
}

// Wire up phase tabs
document.querySelectorAll('.phase').forEach(el => {
  el.addEventListener('click', () => changePhase(+el.dataset.phase));
});

// =========================
// INIT
// =========================
async function init() {
  await loadState();
  // Default: jump to current phase based on progress
  const currentWeek = getCurrentWeek();
  const currentWeekObj = WEEKS.find(w => w.n === currentWeek);
  if (currentWeekObj && !state._phaseUserSet) {
    state.currentPhase = currentWeekObj.p;
  }
  render();
}

init();
</script>
